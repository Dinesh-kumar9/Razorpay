name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Type-check · Security · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy --strict .
        continue-on-error: true   # mypy on ML libs is noisy; keep informational

      - name: Security scan (bandit)
        run: bandit -r . -x tests/ -ll

      - name: Test + Coverage
        run: pytest --cov=. --cov-report=xml --cov-fail-under=75
        env:
          GEMINI_API_KEY: ""   # LLM unit tests use mocks; no live key needed in CI
          GOOGLE_GENAI_USE_VERTEXAI: "false"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
        continue-on-error: true   # Coverage upload is best-effort

  reproducibility:
    name: Simulation reproducibility check
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run simulation (run 1)
        run: python -m simulation.runner 5000 42 2>/dev/null
        env:
          GEMINI_API_KEY: ""
          GOOGLE_GENAI_USE_VERTEXAI: "false"

      - name: Export metrics (run 1)
        run: |
          python -c "
          from audit.logger import AuditLogger
          from simulation.metrics import compute_metrics
          from simulation.baselines import run_blind_retry_baseline, run_naive_multi_retry_baseline
          from ingestion.generator import generate_transactions
          import json, random

          txns = generate_transactions(5000, 42)
          blind = run_blind_retry_baseline(txns, random.Random(1042))
          multi = run_naive_multi_retry_baseline(txns, random.Random(1542))

          a = AuditLogger()
          recs = a.get_all_records()
          m = compute_metrics(recs, blind, multi, seed=42)
          print(json.dumps({'uplift_single': m.uplift_vs_blind_retry_pct, 'uplift_multi': m.uplift_vs_naive_multi_retry_pct, 'violations': m.stopping_rule_violations}))
          " > run1_key_metrics.json

      - name: Clear audit DB
        run: rm -f audit.db

      - name: Run simulation (run 2)
        run: python -m simulation.runner 5000 42 2>/dev/null
        env:
          GEMINI_API_KEY: ""
          GOOGLE_GENAI_USE_VERTEXAI: "false"

      - name: Export metrics (run 2)
        run: |
          python -c "
          from audit.logger import AuditLogger
          from simulation.metrics import compute_metrics
          from simulation.baselines import run_blind_retry_baseline, run_naive_multi_retry_baseline
          from ingestion.generator import generate_transactions
          import json, random

          txns = generate_transactions(5000, 42)
          blind = run_blind_retry_baseline(txns, random.Random(1042))
          multi = run_naive_multi_retry_baseline(txns, random.Random(1542))

          a = AuditLogger()
          recs = a.get_all_records()
          m = compute_metrics(recs, blind, multi, seed=42)
          print(json.dumps({'uplift_single': m.uplift_vs_blind_retry_pct, 'uplift_multi': m.uplift_vs_naive_multi_retry_pct, 'violations': m.stopping_rule_violations}))
          " > run2_key_metrics.json

      - name: Compare (must be identical)
        run: diff run1_key_metrics.json run2_key_metrics.json && echo "Reproducibility check passed ✓"
