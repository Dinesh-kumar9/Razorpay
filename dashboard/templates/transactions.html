{% extends "base.html" %}
{% block title %}Audit Trail{% endblock %}

{% block content %}
<header style="margin-bottom: 2rem;">
  <h1 style="font-size: 2rem; margin-bottom: 0.35rem;">Transaction Audit Trail</h1>
  <p style="color: var(--color-paper-muted); font-size: 0.95rem;">
    Immutable SQLite Audit Ledger &middot; Inspect Every Decision, Override, &amp; Execution
  </p>
</header>

<!-- ── Filter bar ─────────────────────────────────────────────────────── -->
<nav class="filter-ledger-bar" aria-label="Transaction Filter Bar">
  <button id="filter-all"
    type="button"
    class="filter-pill filter-pill--active"
    hx-get="/htmx/transactions?filter=all&page=1"
    hx-target="#txn-table-container"
    hx-swap="innerHTML"
    hx-on::after-request="setActiveFilter(this)">
    All Decisions
  </button>
  <button id="filter-overridden"
    type="button"
    class="filter-pill"
    hx-get="/htmx/transactions?filter=overridden&page=1"
    hx-target="#txn-table-container"
    hx-swap="innerHTML"
    hx-on::after-request="setActiveFilter(this)">
    ⚡ Guardrail Overridden
  </button>
  <button id="filter-recovered"
    type="button"
    class="filter-pill"
    hx-get="/htmx/transactions?filter=recovered&page=1"
    hx-target="#txn-table-container"
    hx-swap="innerHTML"
    hx-on::after-request="setActiveFilter(this)">
    ✓ Revenue Recovered
  </button>
  <button id="filter-escalated"
    type="button"
    class="filter-pill"
    hx-get="/htmx/transactions?filter=escalated&page=1"
    hx-target="#txn-table-container"
    hx-swap="innerHTML"
    hx-on::after-request="setActiveFilter(this)">
    🚨 Escalate to Human (RBI)
  </button>
  <button id="filter-stopped"
    type="button"
    class="filter-pill"
    hx-get="/htmx/transactions?filter=stopped&page=1"
    hx-target="#txn-table-container"
    hx-swap="innerHTML"
    hx-on::after-request="setActiveFilter(this)">
    🛑 Rate-Limited Stop
  </button>
</nav>

<!-- ── Transaction table (HTMX swap target) ─────────────────────────── -->
<article class="case-file">
  <div id="txn-table-container"
    hx-get="/htmx/transactions?filter=all&page=1"
    hx-trigger="load"
    hx-swap="innerHTML">
    <div style="padding:2rem;text-align:center;" class="mono text-muted">Accessing SQLite audit records...</div>
  </div>
</article>

<script>
function setActiveFilter(el) {
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('filter-pill--active'));
  el.classList.add('filter-pill--active');
}
</script>
{% endblock %}
