services:
  # ── Batch simulation ────────────────────────────────────────────────────────
  # Run this first to populate the audit database.
  # Usage: docker compose run --rm simulation
  simulation:
    build: .
    command: python -m simulation.runner
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI:-false}
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
      # Mount data/ directory (not a bare file) to avoid Docker creating audit.db as a directory
      - meridian_db:/app/db
    profiles: [simulation]

  # ── API + Dashboard ─────────────────────────────────────────────────────────
  # Starts the FastAPI server with the HTMX dashboard.
  # Usage: docker compose up api
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI:-false}
      - PYTHONPATH=/app
      # Point the app at the named volume path
      - AUDIT_DB_PATH=/app/db/audit.db
    volumes:
      - ./data:/app/data
      - meridian_db:/app/db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  # Named volume ensures audit.db is always a file, never a directory.
  # 'docker compose down -v' to reset.
  meridian_db:
